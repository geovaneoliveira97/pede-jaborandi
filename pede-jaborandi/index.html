<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP real vai por header HTTP (public/_headers) — frame-ancestors não
         funciona via <meta> e precisa do header para ter efeito. -->
    <title>Pede Jaborandi</title>

    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B54A00" />
    <meta name="description" content="Delivery local de Jaborandi — peça dos melhores comércios da cidade" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pede Jaborandi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Preconnect para fontes (ambos os servidores do Google) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect para Supabase: sem crossorigin para imagens, com crossorigin para API -->
    <link rel="preconnect" href="https://rmuuojuqexsgzxekojtn.supabase.co" />
    <link rel="preconnect" href="https://rmuuojuqexsgzxekojtn.supabase.co" crossorigin />

    <!-- Fontes sem bloquear o render -->
    <!-- O swap para rel=stylesheet acontece em main.tsx, não via onload=""
         inline: CSP com script-src 'self' bloqueia handlers inline. -->
    <link
      id="gfonts-preload"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Spinner visível enquanto o React carrega (melhora FCP percebido) -->
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100svh;background:#fff">
        <div style="width:40px;height:40px;border:4px solid #E85D26;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
